# Shared runtime data outlives any one service restart; cleared on reboot.
d /run/pendulum 0750 pendulum pendulum -
# Optional publisher can write only its lock and credential-validation receipt.
d /run/pendulum/thingspeak 0700 pendulum pendulum -
d /var/lib/pendulum/thingspeak 0700 pendulum pendulum -
# Root-owned directory prevents clients replacing the shared lock/status.
d /run/pendulum-i2c 0750 root pendulum -
f /run/pendulum-i2c/bus-1.lock 0660 root pendulum -
